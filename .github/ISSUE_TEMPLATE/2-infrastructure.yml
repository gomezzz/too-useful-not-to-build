name: "Infrastructure: Benchmarks, loaders, converters, simulators"
description: "Shared infrastructure: benchmarks, loaders, converters, simulators."
title: "Why don't we just "
labels: ["idea", "cat: infrastructure"]
body:
  - type: "markdown"
    attributes:
      value: "Only the first box is required. Fill in whatever else you can; rough guesses beat empty fields, and others can add detail in the comments."
  - type: "textarea"
    id: "idea"
    attributes:
      label: "Why don't we just..."
      description: "Finish the sentence. One or two lines is plenty."
      placeholder: "...agree on shared benchmarks for onboard machine learning?"
    validations:
      required: true
  - type: "textarea"
    id: "useful"
    attributes:
      label: "Why would it be useful?"
      description: "What gets better, faster, cheaper or possible for the first time?"
      placeholder: "Every paper uses its own data and hardware, so results can't be compared and nobody knows what would actually fly."
    validations:
      required: false
  - type: "textarea"
    id: "users"
    attributes:
      label: "Who would use it?"
      description: "A community, a mission, a course, a lab. Roughly how many people?"
      placeholder: "Onboard ML researchers, payload engineers choosing hardware, reviewers."
    validations:
      required: false
  - type: "dropdown"
    id: "domain"
    attributes:
      label: "Domain"
      description: "Pick all that apply."
      multiple: true
      options:
        - "Astronomy"
        - "Earth observation"
        - "Planetary science"
        - "Heliophysics"
        - "Onboard / edge"
        - "Mission operations"
        - "Education and outreach"
        - "Cross-domain"
        - "Other (say which in the idea)"
  - type: "textarea"
    id: "technology"
    attributes:
      label: "What technology?"
      description: "Languages, frameworks, models, hardware, standards or data formats it would build on."
      placeholder: "Python harness, ONNX / TFLite models, reference runs on Jetson, Myriad and FPGA boards."
    validations:
      required: false
  - type: "textarea"
    id: "references"
    attributes:
      label: "Ground truth and references"
      description: "How would we know it works, and what exists already? Reference implementations, validation datasets, published results, related tools here or in other fields. Links welcome."
      placeholder: "Published accuracy and latency figures from in-orbit demonstrations as anchor points."
    validations:
      required: false
  - type: "dropdown"
    id: "complexity"
    attributes:
      label: "How complex is it?"
      description: "Your gut feeling for a first useful version, with today's tools including AI coding assistants."
      multiple: false
      options:
        - "Days: a hackathon or a weekend"
        - "Weeks: one person"
        - "Months: a small team"
        - "Years: a community or a funded project"
        - "No idea"
  - type: "textarea"
    id: "needed"
    attributes:
      label: "What would be needed?"
      description: "Data, compute, domain expertise, access, licences. Guesses are fine."
    validations:
      required: false
